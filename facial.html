<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Proceso - Maru Flor de Loto</title>
    <!-- Cargamos los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --color-fondo: #f4f0f8; --color-principal: #9c27b0; --color-secundario: #6a1b9a; --color-acento: #e1bee7; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--color-fondo); text-align: center; }
        header { background-color: var(--color-secundario); color: white; padding: 2em 1em; }
        h1 { margin: 0; font-size: 2.5em; }
        .container { max-width: 600px; margin: 50px auto; padding: 40px 20px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--color-principal); }
        
        .icono-construccion { font-size: 4em; color: var(--color-acento); margin-bottom: 20px; }
        h2 { color: var(--color-secundario); }
        p { color: #555; font-size: 1.1em; line-height: 1.6; margin-bottom: 30px; }

        .btn-volver { display: inline-block; background-color: white; color: var(--color-secundario); border: 2px solid var(--color-secundario); padding: 12px 30px; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 1.1em; transition: all 0.3s; }
        .btn-volver:hover { background-color: var(--color-acento); color: var(--color-secundario); transform: scale(1.05); }
    </style>
</head>
<body>

    <header>
        <h1>Próximamente</h1>
    </header>

    <div class="container">
        <!-- Ícono de herramientas para indicar "en construcción" -->
        <i class="fas fa-tools icono-construccion"></i>
        
        <h2>Sección en Proceso</h2>
        <p>Estamos seleccionando las mejores fotos de nuestros trabajos y preparando toda la información detallada para esta sección.</p>
        <p><strong>¡Volvé a visitarla muy pronto!</strong></p>
        
        <a href="index.html" class="btn-volver">⬅ Volver a la página principal</a>
    </div>

</body>
</html>
