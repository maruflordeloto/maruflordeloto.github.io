<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masajes - Maru Flor de Loto</title>
    <style>
        :root {
            --color-fondo: #f4f0f8; 
            --color-principal: #9c27b0; 
            --color-secundario: #6a1b9a; 
            --color-acento: #e1bee7; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color-fondo);
        }

        header {
            background-color: var(--color-secundario);
            color: white;
            text-align: center;
            padding: 2em 1em;
        }

        h1 { margin: 0; font-size: 2.5em; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Estructura del collage/galería */
        .collage {
            display: grid;
            /* Esto hace que se adapte automático al tamaño de pantalla */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            align-items: center;
        }

        .collage img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        /* Pequeño efecto al pasar el mouse */
        .collage img:hover {
            transform: scale(1.03);
        }

        .botones-inferiores {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            background-color: var(--color-principal);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .btn:hover { background-color: var(--color-secundario); transform: scale(1.05); }
        
        .btn-volver {
            background-color: white;
            color: var(--color-secundario);
            border: 2px solid var(--color-secundario);
        }
        
        .btn-volver:hover {
            background-color: var(--color-acento);
            color: var(--color-secundario);
        }
    </style>
</head>
<body>

    <header>
        <h1>Servicio de Masajes</h1>
    </header>

    <div class="container">
        
        <!-- GALERÍA DE IMÁGENES (COLLAGE) -->
        <div class="collage">
            <!-- Flyer Beneficios -->
            <img src="beneficios.jpeg" alt="Beneficios de los masajes">
            
            <!-- Flyer Reductores -->
            <img src="reductores.jpeg" alt="Masajes Reductores">
            
            <!-- Flyer Embarazadas -->
            <img src="embarazadas.jpeg" alt="Masajes para embarazadas">
        </div>

        <!-- BOTONES -->
        <div class="botones-inferiores">
            <a href="index.html" class="btn btn-volver">⬅ Volver al inicio</a>
            <a href="https://wa.me/5492974750121" target="_blank" class="btn">📱 Agendar tu cita</a>
        </div>

    </div>

</body>
</html>
